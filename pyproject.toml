[project]
name = "cbtone"
version = "0.1.0"
description = "Hawkish/dovish tone signals from public central-bank communication, with contamination-aware evaluation and event-study tools."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thanatchon Chongmankhong" }]
requires-python = ">=3.11"
keywords = [
  "central-banks",
  "monetary-policy",
  "nlp",
  "llm",
  "event-study",
  "finance",
  "hawkish-dovish",
  "text-analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "polars>=1.5,<2",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.2",
  "pypdf>=4.3",
  "pyyaml>=6.0",
  "yfinance>=1.7.0",
  "pysbd>=0.3.4",
  "cryptography>=43",
  "fonttools>=4.50",
  "statsmodels>=0.14",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
ollama = []
transformers = ["transformers>=4.44", "torch>=2.4"]
api = ["anthropic>=0.40"]
finetune = ["transformers>=4.44", "torch>=2.4", "peft>=0.12"]
docs = ["mkdocs-material>=9.5"]
thai = [
    "pythainlp>=5.4.0",
    "python-crfsuite>=0.9.12",
]

[project.scripts]
cbtone = "cbtone.cli:app"

[project.urls]
Homepage = "https://github.com/thanatchon36/cbtone"
Repository = "https://github.com/thanatchon36/cbtone"
Documentation = "https://thanatchon36.github.io/cbtone/"
Issues = "https://github.com/thanatchon36/cbtone/issues"
Changelog = "https://github.com/thanatchon36/cbtone/blob/main/docs/PROGRESS.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbtone"]

[tool.hatch.build.targets.sdist]
# Keep the sdist small and free of local state: library source, tests, docs and licence files.
# The corpus (data/) and raw caches are not shipped; they follow per-source terms.
include = [
  "/src",
  "/tests",
  "/docs",
  "/schemas",
  "/config",
  "/README.md",
  "/DISCLAIMER.md",
  "/CONTRIBUTING.md",
  "/CITATION.cff",
  "/LICENSE",
  "/Makefile",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/cbtone"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bs4.*", "pypdf.*", "scipy.*", "sklearn.*", "statsmodels.*", "pythainlp.*", "yfinance.*", "transformers.*", "torch.*", "peft.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the internet (deselected in CI)", "slow: long-running"]
addopts = "-m 'not network'"
